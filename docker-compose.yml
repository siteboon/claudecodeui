services:
  cloudcli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcli
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      SERVER_PORT: 3001
      HOST: 0.0.0.0
      DATABASE_PATH: /var/lib/cloudcli/database.db
    volumes:
      - cloudcli_data:/var/lib/cloudcli
      - cloudcli_home:/home/nodejs
      - cloudcli_projects:/workspace
    restart: unless-stopped
    # Inherit the image's Node-based /health probe.

volumes:
  cloudcli_data:
  cloudcli_home:
  cloudcli_projects:
