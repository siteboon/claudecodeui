services:
  cloudcli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudcli-server
    ports:
      - "8082:3001"
    environment:
      NODE_ENV: production
      SERVER_PORT: 3001
      HOST: 0.0.0.0
      DATABASE_PATH: /var/lib/cloudcli/database.db
    volumes:
      - cloudcli_data:/var/lib/cloudcli
      - cloudcli_home:/home/nodejs
      - cloudcli_projects:/workspace
    restart: unless-stopped

volumes:
  cloudcli_data:
  cloudcli_home:
  cloudcli_projects:
