name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Client tests
        run: npm run test:client

      - name: Server tests
        run: npm test

      # The platform build is a separate compilation: IS_PLATFORM is resolved at
      # build time and changes the auth and websocket paths, so the default build
      # alone does not exercise it.
      - name: Build client
        run: npm run build:client

      - name: Build client (platform mode)
        run: npm run build:client
        env:
          VITE_IS_PLATFORM: 'true'
